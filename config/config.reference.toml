# REFERENCE COPY - NOT LIVE. Nothing reads this file.
# The live config is ~/.config/dials/config.toml
# Refresh this snapshot with:  dials config export
# WARNING: that command REGENERATES this file from the live config and does not
# preserve comments - the hand-written notes here are load-bearing, so restore
# them with `git checkout config/config.reference.toml` if you overwrite them.
#
# A Dial is one numpad key holding one window. Dials fire only while NumLock is
# OFF; with NumLock ON the keypad types digits exactly as normal.
#
# Slots: 0-9 / * - + enter        ('.' is reserved for assign mode)

[defaults]
# Falls back to primary if this output is absent. Never store absolute pixels -
# the layout on this machine has changed mid-session before.
#
# The output NAME is not stable either, and it is not a hotplug story: it
# depends on which GPU drives X.
#   system76-power graphics nvidia  -> NVIDIA owns every output: "HDMI-0", "eDP-1-1"
#   system76-power graphics hybrid  -> Intel/modesetting owns X and the NVIDIA
#                                      outputs arrive through PRIME as a SINK
#                                      provider, so they gain a provider prefix:
#                                      "HDMI-1-0", and the panel becomes "eDP-1"
# On 2026-08-07 this box was in `hybrid`, every Dial's "HDMI-0" matched nothing,
# and pick() did exactly what it promises - fell back to primary - so all three
# Dials silently moved to the laptop panel. `dials status` now names that,
# instead of only counting bound Dials.
monitor       = "HDMI-1-0"
# x, y, w, h as fractions of the monitor rect
rect          = [0.0, 0.0, 0.5, 1.0]
# normal = can be buried | above = never buried | hide = hides on focus loss
on_focus_loss = "hide"
# Re-apply geometry on every raise, not just on show.
#
# ON, deliberately. Geometry is applied unconditionally on SHOW - i.e. when a
# window comes back from minimised - but a window that was already visible the
# first time the daemon saw it never goes through SHOW: every press on it is a
# RAISE. With this off, such a window kept whatever size the app chose for
# itself and no Dial ever placed it, which is not what a dropdown panel means.
# The tradeoff accepted in exchange: hand-nudging a Dial window is undone on the
# next keypress. Use `dials capture <slot>` to make a nudge permanent instead.
pin_geometry  = true


# RIGHT half of the ultrawide: 50% wide, full height.
[dials."9"]
label         = "Spotify"
# CAPITAL S. This matches the *class* field of WM_CLASS, and Spotify's is
# ("spotify", "Spotify") - instance lowercase, class capitalised. Lowercase here
# matched nothing, so the Dial reported "Spotify not running" while Spotify was
# on screen, and offered to launch a second copy.
match_class   = "Spotify"
# The scale flag must stay: it is the min-width workaround from the sibling
# spotify_width project. Without it Spotify refuses to go narrow.
launch        = "/snap/bin/spotify --force-device-scale-factor=0.7"
icon          = ""
monitor       = "HDMI-1-0"
rect          = [0.5, 0.0, 0.5, 1.0]
# "normal", not "hide": clicking away from Spotify must not put it away. Still
# buriable, so another window can cover it and pressing 9 surfaces it again.
on_focus_loss = "normal"


# RIGHT half of the ultrawide: 50% wide, full height - the SAME rect as the
# Spotify Dial, deliberately. Two Dials sharing one screen region is a supported
# pattern, not a mistake: 9 puts Spotify there, 5 puts Slack there, and only one
# is up at a time. Nothing special-cases a Dial appearing over another, because
# showing one is an ordinary focus change.
[dials."5"]
label         = "Slack"
# Slack's WM_CLASS is ("slack", "Slack"); the class field is what is matched.
match_class   = "Slack"
# Flatpak, not a deb or a snap - `flatpak list` shows com.slack.Slack under the
# user installation, and there is no slack binary on PATH.
launch        = "flatpak run com.slack.Slack"
# No `icon` key on purpose: icons.py resolves the glyph from match_class
# ("Slack" -> "slack" -> the Slack glyph), so hardcoding it here would just be a
# second place to keep in sync.
monitor       = "HDMI-1-0"
rect          = [0.5, 0.0, 0.5, 1.0]
# Keep Slack visible when focus moves elsewhere, but allow other windows to
# bury it; pressing 5 surfaces it again.
on_focus_loss = "normal"


# Right-hand 30% of the ultrawide, full height. Overlaps the right end of the
# Spotify Dial on purpose - a Dial appearing over another is an ordinary focus
# change, and nothing special-cases it.
[dials."6"]
label         = "Firefox (dial6)"
# Must stay in sync with --class in `launch` below - the class is what identifies
# the window. This is the one pairing not to break when editing this Dial.
match_class   = "Dial6"
# The dial6 profile is registered in profiles.ini, so reference it by name - no
# machine-specific path hash baked into config. If the entry ever goes missing,
# the fallback that bypasses profiles.ini entirely is:
#   firefox --profile ~/.mozilla/firefox/wcobxzqa.dial6 --class=Dial6 ...
launch        = "firefox -P dial6 --class=Dial6 --no-remote --new-instance"
icon          = ""
monitor       = "HDMI-1-0"
# x = 0.7 so the 30% sits flush with the right edge (0.7 + 0.3 = 1.0). Fractions
# must sum to at most 1.0 or the Dial would be placed off-monitor.
rect          = [0.7, 0.0, 0.3, 1.0]
# "normal": stays put when focus moves elsewhere AND can be buried. It was
# "above", which is what kept it permanently on top of everything.
on_focus_loss = "normal"
