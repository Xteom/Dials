<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Dials tray icon, PAUSED: `dials pause` has stood the daemon down, so no key
       is grabbed at all regardless of NumLock. The same shell, greyed, with a
       slash - distinguishable from DORMANT at a glance, which matters because
       the two differ in whether toggling NumLock brings Dials back.

       Two ribs are dropped relative to the other two icons: at 16px the slash
       crosses the fan, and five ribs plus the slash turns into noise.

       KEEP THE <svg> ELEMENT ON LINE 1 - see dials-shell.svg for why. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#9AA0A6" opacity="0.55">
      <path d="M 8 14.9
               C 5.0 14.6 1.5 11.5 1.5 7.6
               A 1.7 1.7 0 0 1 3.67 5.38
               A 1.7 1.7 0 0 1 5.83 4.05
               A 1.7 1.7 0 0 1 8 3.6
               A 1.7 1.7 0 0 1 10.17 4.05
               A 1.7 1.7 0 0 1 12.33 5.38
               A 1.7 1.7 0 0 1 14.5 7.6
               C 14.5 11.5 11.0 14.6 8 14.9 Z"
            stroke-width="1.05"/>
      <g stroke-width="0.75" opacity="0.7">
        <path d="M 8 14.3 L 6.09 5.29"/>
        <path d="M 8 14.3 L 8 4.90"/>
        <path d="M 8 14.3 L 9.91 5.29"/>
      </g>
      <path d="M 6.9 14.55 L 9.1 14.55" stroke-width="1.3"/>
    </g>
    <!-- slash drawn last so it stays legible over the ribs -->
    <path d="M 2.6 13.4 L 13.4 2.6" stroke="#E0564A" stroke-width="1.6"/>
  </g>
</svg>
